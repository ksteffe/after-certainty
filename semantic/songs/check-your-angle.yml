    High-energy old-school East Coast alternative hip-hop with a gritty Brooklyn feel, fused with electro, techno, funk, punk energy, and sample-heavy production. Three distinct male rappers rapidly trade lines, interrupt each other, shout responses, and finish each other’s phrases with playful comic timing. Crunchy breakbeats, distorted bass, turntable scratches, drum-machine loops, funky guitar stabs, analog synth bleeps, robotic vocoder voices, glitch effects, chopped samples, and abrupt stop-start transitions. Fast, sarcastic, witty, chaotic, and slightly absurd rather than aggressive. Verses should feel loose and conversational; hooks should be big group shouts. A robotic voice confidently interrupts throughout and gradually becomes less certain. Raw, energetic, weird, clever, and unpredictable.
